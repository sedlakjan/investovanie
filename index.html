<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investuj s rozumom - demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f9f9ff;
      --card: #ffffff;
      --card-soft: #f0f3ff;
      --card-mid: #e4eaff;
      --ink: #191c20;
      --muted: #585e71;
      --line: #c5c6d0;
      --blue: #4479ff;
      --blue-dark: #00174b;
      --purple: #5851d8;
      --green: #138a4d;
      --red: #c43d3d;
      --yellow: #f2c94c;
      --shadow: 0 8px 24px rgba(68, 121, 255, .065), 0 2px 8px rgba(17, 49, 86, .035);
      --shadow-strong: 0 18px 38px rgba(0, 23, 75, .16);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -10%, rgba(68,121,255,.12), transparent 34rem),
        linear-gradient(180deg, #f9f9ff 0%, #f4f7ff 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100dvh; padding-bottom: 126px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.86);
      border-bottom: 1px solid rgba(197,198,208,.72);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      min-height: 66px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 10px;
      align-items: center;
    }
    .brand {
      text-align: center;
      font-weight: 850;
      color: var(--blue);
      letter-spacing: 0;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(240,243,255,.72);
      color: var(--blue-dark);
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    .icon-btn:hover { background: #e4eaff; }
    .icon-btn:disabled { opacity: .2; cursor: default; }

    main {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 22px 18px 34px;
    }
    .screen { animation: rise .18s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(26px, 8vw, 42px); line-height: 1.08; letter-spacing: 0; margin-bottom: 10px; }
    h2 { font-size: 24px; line-height: 1.2; margin-bottom: 8px; }
    h3 { font-size: 17px; margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.55; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .amount {
      font-size: clamp(30px, 10vw, 48px);
      font-weight: 900;
      letter-spacing: 0;
      color: inherit;
    }

    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.categories { grid-template-columns: 1fr; }
    .section { margin-top: 24px; }
    .card {
      background: var(--card);
      border: 1px solid rgba(197,198,208,.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .hero {
      background:
        radial-gradient(circle at 86% 10%, rgba(255,255,255,.18), transparent 9rem),
        linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      border: 0;
      overflow: hidden;
      position: relative;
    }
    .hero p { color: rgba(255,255,255,.82); }
    .hero:after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -70px;
      top: -65px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
    }
    .dark-card {
      background:
        radial-gradient(circle at 96% 6%, rgba(68,121,255,.42), transparent 9rem),
        linear-gradient(135deg, var(--blue-dark), #113156);
      color: #fff;
      border: 0;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-strong);
    }
    .dark-card p { color: rgba(255,255,255,.74); }
    .stat-card p { margin-bottom: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card strong { display: block; font-size: 22px; }
    .stat-card.actionable {
      width: 100%;
      min-height: 134px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .stat-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .stat-mini-chart {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      height: 46px;
      opacity: .92;
    }
    .stat-mini-chart svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stat-mini-chart .account-line {
      fill: none;
      stroke: var(--blue);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .stat-mini-chart .account-area { fill: rgba(68,121,255,.12); }
    .page-intro {
      margin-bottom: 22px;
    }
    .page-intro h1,
    .page-intro h2 {
      margin-bottom: 4px;
      font-size: 24px;
      font-weight: 850;
    }
    .page-intro p {
      margin-bottom: 0;
      font-size: 14px;
    }
    .total-card {
      min-height: 272px;
      width: 100%;
      padding: 28px 22px 20px;
      display: grid;
      justify-items: center;
      text-align: center;
      text-decoration: none;
      isolation: isolate;
    }
    .total-card .amount {
      font-size: clamp(44px, 13vw, 68px);
      line-height: 1.2;
      position: relative;
      z-index: 1;
    }
    .total-watermark {
      position: absolute;
      right: -18px;
      top: -22px;
      font-size: 132px;
      opacity: .1;
      color: #fff;
      line-height: 1;
    }
    .soft-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      border-radius: 8px;
      padding: 4px 8px;
      background: rgba(26, 188, 110, .16);
      color: #39d987;
      font-size: 12px;
      font-weight: 900;
    }
    .soft-badge.loss {
      background: #fff0f0;
      color: var(--red);
    }
    .neutral-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 8px;
      padding: 4px 8px;
      background: rgba(222, 211, 143, .18);
      color: #ded38f;
      font-size: 12px;
      font-weight: 900;
    }
    .account-chart {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      height: 128px;
      margin-top: 16px;
      color: #fff;
    }
    .account-chart svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .account-chart .chart-grid { stroke: rgba(255,255,255,.12); }
    .account-chart .account-line {
      fill: none;
      stroke: #ded38f;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.22));
    }
    .account-chart .account-area { fill: rgba(222,211,143,.14); }
    .account-start-dot {
      fill: #ded38f;
      filter: drop-shadow(0 0 14px rgba(222,211,143,.72));
      animation: accountBlink 1.45s ease-in-out infinite;
    }
    .account-start-ring {
      fill: none;
      stroke: #ded38f;
      stroke-width: 3;
      opacity: .28;
    }
    .account-start-label {
      fill: #fff7c7;
      font-size: 21px;
      font-weight: 950;
    }
    .account-start-caption {
      fill: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .account-start-axis {
      stroke: rgba(255,255,255,.22);
      stroke-width: 1.4;
    }
    .account-start-path {
      fill: none;
      stroke: rgba(222,211,143,.82);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes accountBlink {
      0%, 100% { opacity: .52; }
      50% { opacity: 1; }
    }
    .account-chart-card {
      min-height: 300px;
      padding: 18px;
    }
    .account-chart-card .chart {
      height: 260px;
      margin-top: 10px;
    }
    .action-stack {
      display: grid;
      gap: 12px;
    }
    .action-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .action-btn {
      border-radius: 16px;
      min-height: 54px;
      font-size: 15px;
    }
    .action-icon {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: 17px;
      line-height: 1;
    }
    .portfolio-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }
    .portfolio-head h2,
    .portfolio-head h3 {
      margin: 0;
      font-size: 18px;
    }
    .link-btn {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 13px;
      font-weight: 850;
      padding: 0;
    }
    .portfolio-card {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 13px;
      align-items: center;
      text-align: left;
      padding: 16px;
      border-radius: 20px;
    }
    .portfolio-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #edf1ff;
      color: var(--blue);
      font-size: 21px;
      font-weight: 900;
    }
    .portfolio-title {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 850;
    }
    .portfolio-meta {
      margin: 0;
      color: #737989;
      font-size: 12px;
      font-weight: 700;
    }
    .portfolio-value {
      color: var(--ink);
      text-align: right;
      font-weight: 900;
      white-space: nowrap;
    }
    .portfolio-gain {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .payment-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 12px;
      align-items: center;
    }
    .copy-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: var(--card-soft);
      color: var(--blue);
      font-weight: 900;
    }
    .order-card {
      border-radius: 20px;
      padding: 20px;
    }
    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .wallet-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--card-soft);
      color: var(--blue);
      font-size: 22px;
      font-weight: 900;
    }
    .mini-chart {
      width: 96px;
      height: 48px;
      opacity: .95;
    }
    .order-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .summary-box {
      border-radius: 16px;
      background: var(--card-soft);
      border: 1px solid rgba(197,198,208,.38);
      padding: 14px;
    }
    .summary-box p {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .summary-box strong {
      display: block;
      font-size: 16px;
    }
    .order-total {
      margin-top: 14px;
      border-radius: 20px;
      background: var(--blue-dark);
      color: #fff;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow-strong);
    }
    .order-total span { color: rgba(255,255,255,.78); }
    .order-total strong { font-size: 22px; text-align: right; }
    .legal {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.55;
      padding-inline: 14px;
    }

    .btn {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 850;
      text-decoration: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 10px 26px rgba(68,121,255,.24); }
    .btn.success { background: var(--green); color: #fff; box-shadow: 0 10px 26px rgba(19,138,77,.20); }
    .btn.dark { background: var(--blue-dark); color: #fff; }
    .btn.ghost { background: #fff; color: var(--blue); border: 1px solid rgba(47,104,255,.24); }
    .btn.soft { background: var(--card-soft); color: var(--blue-dark); }
    .btn.danger { background: #fff2f2; color: var(--red); border: 1px solid #ffd4d4; }
    .btn.full { width: 100%; }
    .btn[disabled] { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .choice {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 60px;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(68,121,255,.035);
    }
    .choice.active { border-color: var(--blue); background: var(--card-soft); color: var(--blue-dark); }

    .input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 13px 15px;
      font-weight: 800;
      color: var(--ink);
      outline: none;
    }
  
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(68,121,255,.14); }
    .field { display: grid; gap: 8px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; }
    .input-wrap { position: relative; }
    .input-wrap .suffix {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 900;
    }
    .input-wrap .input { padding-right: 54px; }

    .rows { display: grid; gap: 10px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(197,198,208,.48);
    }
    .row:last-child { border-bottom: 0; }
    .row span:first-child { color: var(--muted); }
    .row strong, .row span:last-child { text-align: right; }

    .asset-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .asset-card h3 { margin-bottom: 3px; }
    .asset-card p { margin-bottom: 0; font-size: 13px; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 18px;
      background: #fff;
      border: 1px solid rgba(117,119,128,.36);
      border-radius: 28px;
      box-shadow: inset 0 -2px 0 rgba(0,23,75,.04), 0 4px 12px rgba(17,49,86,.08);
      color: var(--muted);
      margin-top: 18px;
    }
    .search-box span {
      font-size: 28px;
      color: #667085;
    }
    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
      font-weight: 650;
    }
    .search-box input::placeholder { color: #747b8f; }
    .category-card {
      position: relative;
      min-height: 260px;
      overflow: hidden;
      text-align: left;
      border: 1px solid rgba(228,234,255,.95);
      background: #fff;
      box-shadow: 0 9px 22px rgba(68,121,255,.075);
      padding: 24px;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(68,121,255,.13);
    }
    .category-card:after {
      content: "";
      position: absolute;
      right: -76px;
      bottom: -86px;
      width: 250px;
      height: 250px;
      border-radius: 999px;
      opacity: .42;
      pointer-events: none;
    }
    .category-card.stocks:after { background: radial-gradient(circle, rgba(33, 220, 139, .42), transparent 66%); }
    .category-card.etf:after { background: radial-gradient(circle, rgba(68, 121, 255, .24), transparent 66%); }
    .category-card.commodities:after { background: radial-gradient(circle, rgba(242, 201, 76, .42), transparent 66%); }
    .category-card.crypto:after { background: radial-gradient(circle, rgba(88, 81, 216, .28), transparent 66%); }
    .category-card.bonds:after { background: radial-gradient(circle, rgba(19, 138, 77, .26), transparent 66%); }
    .category-card .cat-watermark {
      position: absolute;
      right: 52px;
      bottom: 42px;
      z-index: 0;
      color: #2f68ff;
      opacity: .055;
      font-size: 148px;
      line-height: 1;
      font-weight: 900;
      transform: rotate(-4deg);
      pointer-events: none;
    }
    .category-card.stocks .cat-watermark { color: #15b86f; }
    .category-card.etf .cat-watermark { color: #4479ff; }
    .category-card.commodities .cat-watermark { color: #d8a313; }
    .category-card.crypto .cat-watermark { color: #5851d8; }
    .category-card.bonds .cat-watermark { color: #138a4d; }
    .cat-art {
      position: relative;
      z-index: 1;
      display: block;
      width: min(52%, 150px);
      aspect-ratio: 1;
      object-fit: contain;
      margin: -8px 0 12px -8px;
      filter: drop-shadow(0 16px 20px rgba(17,49,86,.12));
      user-select: none;
      pointer-events: none;
    }
    .category-card.bonds .cat-art {
      width: min(54%, 156px);
      margin: -16px 0 28px -42px;
      transform: scale(1.72);
      transform-origin: left top;
      filter: drop-shadow(0 18px 26px rgba(19,138,77,.18)) drop-shadow(0 12px 18px rgba(68,121,255,.14));
    }
    .asset-icon,
    .detail-logo {
      display: grid;
      place-items: center;
      color: var(--blue-dark);
      background: #dce2ff;
      font-weight: 900;
    }
    .category-card .cat-title {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      font-size: 36px;
      line-height: 1.05;
      color: #071225;
      font-weight: 900;
    }
    .category-card .cat-sub {
      position: relative;
      z-index: 1;
      margin: 0 0 34px;
      color: #737989;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .category-card .cat-link {
      position: relative;
      z-index: 1;
      color: var(--blue);
      font-size: 20px;
      font-weight: 850;
    }
    .category-card .cat-arrow {
      position: absolute;
      right: 30px;
      bottom: 36px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 14px 28px rgba(17,49,86,.11);
      color: var(--blue);
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
    }
    .asset-list { gap: 12px; }
    .market-card {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 16px;
      border-radius: 16px;
      text-align: left;
      box-shadow: 0 7px 18px rgba(68,121,255,.075);
    }
    .asset-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      font-size: 18px;
      color: var(--blue);
      background: #edf1ff;
    }
    .market-card h3 {
      margin: 0 0 3px;
      font-size: 16px;
      color: #313848;
    }

    .market-card .ticker {
      margin: 0 0 12px;
      color: #6d7484;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .market-card .desc {
      grid-column: 2 / 4;
      margin: -4px 0 4px;
      font-size: 13px;
      color: #616978;
    }
    .market-price {
      text-align: right;
      color: #313848;
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
    }
    .price-slot {
      display: inline-flex;
      max-width: 100%;
      overflow: hidden;
      vertical-align: bottom;
      line-height: 1.08;
    }
    .price-slot span {
      display: inline-block;
      animation: slotRoll .54s cubic-bezier(.2,.75,.2,1);
      will-change: transform, opacity, filter;
    }
    @keyframes slotRoll {

    function defaultState() {
      const prices = {};
      assets.forEach(asset => {
        prices[asset.id] = roundMoney(asset.basePrice * (0.985 + seeded(asset.id) * 0.03));
      });
      return {
        sessionStart: Date.now(),
        transferredAmount: 0,
        cash: 0,
        holdings: {},
        prices,
        tradingPaused: false,
        history: {
          account: [],
          investments: []
        }
      };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!parsed || Date.now() - parsed.sessionStart > DAY_MS) {
          localStorage.removeItem(STORAGE_KEY);
          return defaultState();
        }
        const defaults = defaultState();
        return {
          ...defaults,
          ...parsed,
          prices: { ...defaults.prices, ...(parsed.prices || {}) },
          history: {
            account: parsed.history?.account || [],
            investments: parsed.history?.investments || []
          }
        };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function seeded(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      return (hash % 1000) / 1000;
    }

    function seededUnit(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return ((hash >>> 0) % 100000) / 100000;
    }

    function fakeIsin(id, index) {
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let hash = 2166136261 + index;
      const source = `${id}-5penazi-demo`;
      let suffix = "";
      for (let i = 0; i < 10; i++) {
        hash ^= source.charCodeAt(i % source.length) + i;
        hash = Math.imul(hash, 16777619);
        suffix += alphabet[(hash >>> 0) % alphabet.length];
      }
      return `5P${suffix}`;
    }

    function formatMoney(value, currency = "EUR") {
      return new Intl.NumberFormat("sk-SK", { style: "currency", currency, maximumFractionDigits: 2 }).format(Number(value) || 0);
    }

    function formatPct(value) {
      const n = Math.abs(Number(value) || 0) < 0.005 ? 0 : Number(value) || 0;
      return `${n >= 0 ? "↗ +" : "↘ "}${n.toFixed(2).replace(".", ",")} %`;
    }

    function formatAxisPct(value) {
      const n = Math.abs(Number(value) || 0) < 0.005 ? 0 : Number(value) || 0;
      const precision = Math.abs(n) < 10 ? 1 : 0;
      return `${n > 0 ? "+" : ""}${n.toFixed(precision).replace(".", ",")} %`;
    }

    function formatAssetMoney(asset, value) {
      return formatMoney(value, asset.currency || "EUR");
    }

    function accountValue(asset, value) {
      const amount = Number(value) || 0;
      if (asset.currency === "USD") return roundMoney(amount * USD_EUR_RATE);
      if (asset.currency === "CHF") return roundMoney(amount * CHF_EUR_RATE);
      return roundMoney(amount);
    }

    function conversionFee(asset, accountAmount) {
      return asset.currency !== "EUR" ? roundMoney(accountAmount * CONVERSION_FEE_RATE) : 0;
    }

    function buyBreakdown(asset, units) {
      const assetSubtotal = roundMoney((Number(units) || 0) * (state.prices[asset.id] || asset.basePrice));
      const accountSubtotal = accountValue(asset, assetSubtotal);
      const fee = conversionFee(asset, accountSubtotal);
      return {
        assetSubtotal,
        accountSubtotal,
        fee,
        total: roundMoney(accountSubtotal + fee)
      };
    }

    function animatedPrice(value, className = "", currency = "EUR") {
      const text = formatMoney(value, currency);
      return `<span class="price-slot ${className}" aria-label="${text}"><span>${text}</span></span>`;
    }

    function buyCurrentPriceMarkup(asset) {
      const price = state.prices[asset.id];
      const primary = `1 ${asset.id} = ${animatedPrice(price, "", asset.currency)}`;
      const converted = asset.currency !== "EUR" ? `<span class="converted">≈ ${formatMoney(accountValue(asset, price))}</span>` : "";
      return `${primary}${converted}`;
    }

    function formatUnits(value) {
      const n = Number(value) || 0;
      return n.toLocaleString("sk-SK", { maximumFractionDigits: 4 });
    }

    function roundMoney(value) {
      return Math.round((Number(value) || 0) * 100) / 100;
    }

    function portfolioCost() {
      return Object.values(state.holdings).reduce((sum, holding) => sum + ((Number(holding.units) || 0) * (Number(holding.avgPrice) || 0)), 0);
    }

    function portfolioGainPct() {
      const cost = portfolioCost();
      if (!cost) return 0;
      return ((portfolioValue() - cost) / cost) * 100;
    }

    function accountTotal() {
      return roundMoney(state.cash + portfolioValue());
    }

    function ensureHistory() {
      state.history ||= {};
      state.history.account ||= [];
      state.history.investments ||= [];
      if (!state.history.account.length && state.transferredAmount > 0) {
        state.history.account.push({
          time: state.sessionStart || Date.now(),
          value: accountTotal(),
          cash: roundMoney(state.cash),
          investments: roundMoney(portfolioValue()),
          deposited: roundMoney(state.transferredAmount)
        });
      }
      if (!state.history.investments.length && portfolioCost() > 0) {
        state.history.investments.push({ time: Date.now(), value: roundMoney(portfolioCost()), cost: roundMoney(portfolioCost()) });
      }
    }

    function appendHistorySample({ investmentValue = portfolioValue(), investmentStartValue = null, accountFlow = 0 } = {}) {
      ensureHistory();
      const now = Date.now();
      const investments = roundMoney(investmentValue);
      const total = roundMoney(state.cash + investments);
      const append = (items, point) => {
        const last = items[items.length - 1];
        if (last && now - last.time < 850) {
          items[items.length - 1] = { ...last, ...point, time: now };
        } else {
          items.push({ time: now, ...point });
        }
        return items.slice(-8640);
      };
      state.history.account = append(state.history.account, {
        value: total,
        cash: roundMoney(state.cash),
        investments,
        deposited: roundMoney(state.transferredAmount),
        flow: roundMoney(accountFlow)
      });
      if (investmentStartValue !== null || investments > 0 || state.history.investments.length) {
        state.history.investments = append(state.history.investments, {
          value: investmentStartValue !== null ? roundMoney(investmentStartValue) : investments,
          cost: roundMoney(portfolioCost())
        });
      }
    }

    function categoryOf(name) {
      return categories.find(cat => cat.name === name || cat.assetCategory === name);
    }

    function movePrices() {
      assets.forEach(asset => {
        const cat = categoryOf(asset.category);
        const volatility = cat ? cat.volatility : 0.015;
        const drift = (Math.random() - 0.47) * volatility;
        const current = state.prices[asset.id] || asset.basePrice;
        const min = asset.basePrice * 0.65;
        const max = asset.basePrice * 1.45;
        state.prices[asset.id] = roundMoney(Math.min(max, Math.max(min, current * (1 + drift))));
      });
      appendHistorySample();
      saveState();
    }

    function canAutoRefreshPrices() {

      return true;

          const amount = Number(String(amountInput?.value || "").replace(",", ".")) || 0;

    function chartSvg(assetId) {
      const asset = byId[assetId];
      const range = selectedChartRange;
      const series = historySeries(assetId, range);
      const prices = series.map(point => point.price);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const padding = Math.max(3, (maxPrice - minPrice) * .18);
      const scale = niceScale(minPrice - padding, maxPrice + padding, 4, maxPrice >= 25 ? 5 : 1);
      const yMin = scale.min;
      const yMax = scale.max;
      const left = 54;
      const top = 18;
      const width = 348;
      const height = 146;
      const bottom = top + height;
      const toX = index => left + (index / Math.max(1, series.length - 1)) * width;
      const toY = price => bottom - ((price - yMin) / Math.max(.01, yMax - yMin)) * height;
      const points = series.map((point, index) => [toX(index), toY(point.price)]);
      const line = points.map((point, index) => `${index ? "L" : "M"} ${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(" ");
      const area = `${line} L ${left + width} ${bottom} L ${left} ${bottom} Z`;
      const ticks = scale.ticks.slice().reverse();
      const xLabels = range === "1D" ? ["9:00", "13:00", "17:00"] : range === "5D" ? ["Po", "St", "Pi"] : ["Jan", "Jun", "Dec"];
      const last = series[series.length - 1].price;
      const first = series[0].price;
      const stroke = last >= first ? "#138a4d" : "#c43d3d";
      return `
        <svg viewBox="0 0 420 220" role="img" aria-label="Fiktivny historicky graf ceny aktiv ${asset.name}">
          <defs>
            <linearGradient id="g-${assetId}-${range}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${stroke}" stop-opacity=".22"/>
              <stop offset="1" stop-color="${stroke}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <text class="chart-title" x="54" y="15">Cena</text>
          <text class="chart-title" x="372" y="204">Cas</text>
          ${ticks.map((tick, index) => {
            const y = toY(tick);
            return `<line class="chart-grid" x1="${left}" y1="${y}" x2="${left + width}" y2="${y}"></line><text class="chart-label" x="6" y="${y + 4}">${formatAssetMoney(asset, tick)}</text>`;
          }).join("")}
          <line class="chart-axis" x1="${left}" y1="${top}" x2="${left}" y2="${bottom}"></line>
          <line class="chart-axis" x1="${left}" y1="${bottom}" x2="${left + width}" y2="${bottom}"></line>
          ${xLabels.map((label, index) => {
            const x = left + index * (width / 2);
            return `<text class="chart-label" text-anchor="middle" x="${x}" y="188">${label}</text>`;
          }).join("")}
          <path d="${area}" fill="url(#g-${assetId}-${range})"></path>
          <path d="${line}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="${points[points.length - 1][0].toFixed(1)}" cy="${points[points.length - 1][1].toFixed(1)}" r="4.8" fill="${stroke}"></circle>
        </svg>
      `;
    }

    function actualHistorySeries(kind, range, fallbackValue = 0) {
      ensureHistory();
      const source = state.history[kind] || [];
      const maxAge = { "1D": DAY_MS, "5D": DAY_MS * 5, "1R": DAY_MS * 365 }[range] || DAY_MS;
      const cutoff = Date.now() - maxAge;
      let series = source.filter(point => point.time >= cutoff);
      if (!series.length && source.length) series = [source[source.length - 1]];
      if (!series.length) series = [{ time: Date.now(), value: roundMoney(fallbackValue), cost: roundMoney(portfolioCost()) }];
      const latestValue = kind === "account" ? accountTotal() : portfolioValue();
      const last = series[series.length - 1];
      if (!last || Math.abs((last.value || 0) - latestValue) > .005) {
        series = [...series, {
          time: Date.now(),
          value: roundMoney(latestValue),
          cash: roundMoney(state.cash),
          investments: roundMoney(portfolioValue()),
          deposited: roundMoney(state.transferredAmount),
          cost: roundMoney(portfolioCost())
        }];
      }
      let runningDeposited = 0;
      return series.map((point, index) => {
        if (kind !== "account") return { ...point, value: roundMoney(point.value) };
        const investments = point.investments !== undefined ? Number(point.investments) : Math.max(0, Number(point.value) - Number(state.cash || 0));
        const cash = point.cash !== undefined ? Number(point.cash) : Math.max(0, Number(point.value) - investments);
        if (point.deposited !== undefined) {
          runningDeposited = Number(point.deposited) || 0;
        } else if (point.flow) {
          runningDeposited = roundMoney(runningDeposited + Number(point.flow));
        } else if (index === 0) {
          runningDeposited = roundMoney(point.value || state.transferredAmount || 0);
        }
        return {
          ...point,
          value: roundMoney(point.value),
          cash: roundMoney(cash),
          investments: roundMoney(investments),
          deposited: roundMoney(runningDeposited || state.transferredAmount || point.value || 0),
          flow: roundMoney(point.flow || 0)
        };
      });
    }

    function accountHistorySeries(range) {
      return actualHistorySeries("account", range, accountTotal());
    }

    function accountStartDeposit(series = state.history?.account || []) {
      const firstDeposit = series.find(point => point.flow > 0);
      const firstPoint = series[0];
      return roundMoney(firstDeposit?.flow || firstPoint?.deposited || firstPoint?.value || state.transferredAmount || 0);
    }

    function accountEvents(series = accountHistorySeries(selectedAccountRange)) {
      return series
        .map((point, index) => ({ ...point, index }))
        .filter(point => point.index > 0 && point.flow && Math.abs(point.flow) > .005);
    }

    function scopedAccountSeries(range, scope = selectedAccountScope) {
      const series = accountHistorySeries(range);
      if (scope !== "latest") return series;
      const events = accountEvents(series);
      const lastEvent = events[events.length - 1];
      if (!lastEvent) return series;
      return series.slice(lastEvent.index).map((point, pointIndex) => pointIndex === 0 ? { ...point, flow: 0 } : point);
    }

    function compactAccountSeries(range) {
      const series = accountHistorySeries(range);
      const firstInvestmentIndex = series.findIndex(point => Number(point.investments) > .005);
      if (firstInvestmentIndex < 0) return series;
      const startIndex = Math.max(0, firstInvestmentIndex - 1);
      return series.slice(startIndex).map((point, index) => index === 0 ? { ...point, flow: 0 } : point);
    }

    function accountChange(range) {
      const series = accountHistorySeries(range);
      const first = series[0]?.value || 0;
      const last = series[series.length - 1]?.value || 0;
      return roundMoney(last - first);
    }

    function formatMoneyChange(value) {
      const amount = roundMoney(value);
      return `${amount >= 0 ? "+" : ""}${formatMoney(amount)}`;
    }

    function accountChangeLabel(range) {
      return range === "1D" ? "Zmena dnes" : "Zmena za obdobie";
    }

    function investmentHistorySeries(range) {
      return actualHistorySeries("investments", range, portfolioValue());
    }

    function investmentPerformanceSeries(range) {
      const currentCost = portfolioCost();
      if (currentCost <= 0) {
        return [{ time: Date.now(), value: 0, moneyValue: 0, cost: 0 }];
      }
      return investmentHistorySeries(range).map(point => {
        const cost = Number(point.cost) || currentCost || Number(point.value) || 1;
        const value = cost ? ((Number(point.value) - cost) / cost) * 100 : 0;
        return { ...point, moneyValue: point.value, value: roundMoney(value) };
      });
    }

    function seriesGrowthPct(series) {
      const first = series[0]?.value || 1;
      const last = series[series.length - 1]?.value || 0;
      return ((last - first) / first) * 100;
    }

    function accountGrowthPct(range) {
      return seriesGrowthPct(accountHistorySeries(range));
    }

    function niceTickStep(rawStep, minStep = 1) {
      const magnitude = Math.pow(10, Math.floor(Math.log10(Math.max(0.0001, rawStep))));
      const normalized = rawStep / magnitude;
      const nice = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 2.5 ? 2.5 : normalized <= 5 ? 5 : 10;
      return Math.max(minStep, nice * magnitude);
    }

    function niceScale(minValue, maxValue, tickCount = 4, minStep = 1, floorAtZero = true) {
      if (minValue === maxValue) {
        const step = niceTickStep(Math.max(minStep, Math.abs(maxValue) / 3), minStep);
        const min = Math.floor((minValue - step) / step) * step;
        const max = Math.ceil((maxValue + step) / step) * step;
        return {
          min: floorAtZero ? Math.max(0, min) : min,
          max,
          ticks: Array.from({ length: tickCount }, (_, index) => max - (index * step)).reverse()
        };
      }
      const rawStep = (maxValue - minValue) / Math.max(1, tickCount - 1);
      const step = niceTickStep(rawStep, minStep);
      const min = floorAtZero ? Math.max(0, Math.floor(minValue / step) * step) : Math.floor(minValue / step) * step;
      const max = Math.ceil(maxValue / step) * step;
      const ticks = [];
      for (let value = min; value <= max + step * .5; value += step) {
        ticks.push(roundMoney(value));
      }
      while (ticks.length < tickCount) ticks.push(roundMoney((ticks[ticks.length - 1] || 0) + step));
      return { min, max: ticks[ticks.length - 1], ticks };
    }

    function chartMinStep(maxValue) {
      if (maxValue < 50) return 1;
      if (maxValue < 100) return 5;
      if (maxValue < 250) return 25;
      if (maxValue < 500) return 50;
      return 100;
    }

    function historyChartSvg({ series, range = "1D", compact = false, label = "Graf vývoja", currency = "EUR", valueFormatter = null, minStep = null, floorAtZero = true, includeZero = false, strokeOverride = null, areaOpacity = .22, minRange = null }) {
      const values = series.map(point => point.value);
      const scaleValues = includeZero ? [...values, 0] : values;
      const minPrice = Math.min(...values);
      const maxPrice = Math.max(...values);
      let minScaleValue = Math.min(...scaleValues);
      let maxScaleValue = Math.max(...scaleValues);
      if (minRange && maxScaleValue - minScaleValue < minRange) {
        const center = (minScaleValue + maxScaleValue) / 2;
        minScaleValue = center - (minRange / 2);
        maxScaleValue = center + (minRange / 2);
      }
      const step = minStep ?? chartMinStep(maxPrice);
      const padding = Math.max(step, (maxScaleValue - minScaleValue) * .22);
      const scale = niceScale(minScaleValue - padding, maxScaleValue + padding, 4, step, floorAtZero);
      const yMin = scale.min;
      const yMax = scale.max;
      const view = compact ? { w: 420, h: 130, l: 14, t: 12, r: 14, b: 18 } : { w: 420, h: 220, l: 56, t: 18, r: 18, b: 42 };
      const width = view.w - view.l - view.r;
      const height = view.h - view.t - view.b;
      const toX = index => view.l + (index / Math.max(1, series.length - 1)) * width;
      const toY = price => view.t + height - ((price - yMin) / Math.max(.01, yMax - yMin)) * height;
      const points = series.map((point, index) => [toX(index), toY(point.value)]);
      const line = points.map((point, index) => `${index ? "L" : "M"} ${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(" ");
      const area = `${line} L ${view.l + width} ${view.t + height} L ${view.l} ${view.t + height} Z`;
      const stroke = strokeOverride || (values[values.length - 1] >= values[0] ? "#138a4d" : "#c43d3d");
      if (compact) {
        return `
          <svg viewBox="0 0 ${view.w} ${view.h}" role="img" aria-label="${label}">
            <path class="account-area" d="${area}" style="fill:${stroke};fill-opacity:${areaOpacity}"></path>
            <path class="account-line" d="${line}" style="stroke:${stroke}"></path>
          </svg>
        `;
      }
      const ticks = scale.ticks.slice().reverse();
      const firstTime = series[0]?.time || Date.now();
      const lastTime = series[series.length - 1]?.time || Date.now();
      const middleTime = firstTime + ((lastTime - firstTime) / 2);
      const showSeconds = lastTime - firstTime < 60 * 60 * 1000;
      const labelTime = time => new Intl.DateTimeFormat("sk-SK", { hour: "2-digit", minute: "2-digit", second: showSeconds ? "2-digit" : undefined }).format(new Date(time));
      const xLabels = series.length <= 2 ? ["Štart", "", "Teraz"] : [labelTime(firstTime), labelTime(middleTime), labelTime(lastTime)];
      return `
        <svg viewBox="0 0 420 220" role="img" aria-label="${label}">
          <defs>
            <linearGradient id="account-g-${range}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${stroke}" stop-opacity=".22"/>
              <stop offset="1" stop-color="${stroke}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${ticks.map((tick, index) => {
            const y = toY(tick);
            return `<line class="chart-grid" x1="${view.l}" y1="${y}" x2="${view.l + width}" y2="${y}"></line><text class="chart-label" x="6" y="${y + 4}">${valueFormatter ? valueFormatter(tick) : formatMoney(tick, currency)}</text>`;
          }).join("")}
          <line class="chart-axis" x1="${view.l}" y1="${view.t}" x2="${view.l}" y2="${view.t + height}"></line>
          <line class="chart-axis" x1="${view.l}" y1="${view.t + height}" x2="${view.l + width}" y2="${view.t + height}"></line>
          ${xLabels.map((label, index) => {
            const x = view.l + index * (width / 2);
            return `<text class="chart-label" text-anchor="middle" x="${x}" y="196">${label}</text>`;
          }).join("")}
          <path d="${area}" fill="url(#account-g-${range})"></path>
          <path d="${line}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="${points[points.length - 1][0].toFixed(1)}" cy="${points[points.length - 1][1].toFixed(1)}" r="4.8" fill="${stroke}"></circle>
        </svg>
      `;
    }

    function getNiceDomain(values) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min;
      const minWindow = 2;
      const padding = Math.max(range * .25, .5);
      const lower = Math.floor((min - padding) * 2) / 2;
      const upper = Math.ceil((max + padding) * 2) / 2;
      if (upper - lower < minWindow) {
        const center = (min + max) / 2;
        return [
          Math.floor((center - minWindow / 2) * 2) / 2,
          Math.ceil((center + minWindow / 2) * 2) / 2
        ];
      }
      return [lower, upper];
    }

    function accountCompositionChartSvg(range = "1D", compact = false) {

      const totals = series.map(point => point.value);
      const deposits = series.map(point => point.deposited || 0);
      const [domainMin, domainMax] = getNiceDomain([...totals, ...deposits]);
      const view = compact ? { w: 420, h: 130, l: 14, t: 12, r: 14, b: 18 } : { w: 420, h: 220, l: 56, t: 18, r: 18, b: 42 };
      const width = view.w - view.l - view.r;
      const height = view.h - view.t - view.b;
      const yMin = domainMin;
      const yMax = domainMax;
      const toX = index => view.l + (index / Math.max(1, series.length - 1)) * width;
      const toY = value => view.t + height - ((value - yMin) / Math.max(.01, yMax - yMin)) * height;
      const pointsFor = key => series.map((point, index) => [toX(index), toY(point[key] || 0)]);
      const totalPoints = pointsFor("value");
      const depositPoints = pointsFor("deposited");
      const stepLine = points => points.map((point, index) => {
        if (!index) return `M ${point[0].toFixed(1)} ${point[1].toFixed(1)}`;
        const previous = points[index - 1];
        return series[index].flow ? `L ${point[0].toFixed(1)} ${previous[1].toFixed(1)} L ${point[0].toFixed(1)} ${point[1].toFixed(1)}` : `L ${point[0].toFixed(1)} ${point[1].toFixed(1)}`;
      }).join(" ");
      const totalLine = stepLine(totalPoints);
      const depositLine = stepLine(depositPoints);
      const area = `${totalLine} L ${view.l + width} ${view.t + height} L ${view.l} ${view.t + height} Z`;
      const tickStep = niceTickStep((yMax - yMin) / 4, .5);
      const tickStart = Math.ceil(yMin / tickStep) * tickStep;
      const ticks = [];
      for (let tick = tickStart; tick <= yMax + tickStep * .25; tick += tickStep) ticks.push(roundMoney(tick));
      while (ticks.length < 4) ticks.unshift(roundMoney((ticks[0] ?? yMin) - tickStep));
      const events = compact ? [] : series
        .map((point, index) => ({ ...point, index }))
        .filter(point => point.flow && Math.abs(point.flow) > .005 && point.index > 0)
        .slice(-2);
      if (compact) {
        return `
          <svg viewBox="0 0 ${view.w} ${view.h}" role="img" aria-label="Stav účtu v čase">
            <path class="account-value-area" d="${area}" style="fill:rgba(222,211,143,.13)"></path>
            <path class="account-deposit-line" d="${depositLine}" style="stroke:rgba(255,255,255,.45)"></path>
            <path class="account-line" d="${totalLine}" style="stroke:#ded38f"></path>
          </svg>
        `;
      }
      const xLabels = ["Štart", "", "Teraz"];
      return `
        <svg viewBox="0 0 420 220" role="img" aria-label="Stav účtu v čase">
          ${ticks.slice().reverse().map(tick => {
            const y = toY(tick);
            return `<line class="chart-grid" x1="${view.l}" y1="${y}" x2="${view.l + width}" y2="${y}"></line><text class="chart-label" x="6" y="${y + 4}">${formatMoney(tick)}</text>`;
          }).join("")}
          <line class="chart-axis" x1="${view.l}" y1="${view.t}" x2="${view.l}" y2="${view.t + height}"></line>
          <line class="chart-axis" x1="${view.l}" y1="${view.t + height}" x2="${view.l + width}" y2="${view.t + height}"></line>
          <path class="account-deposit-line" d="${depositLine}"></path>
          <path class="account-total-line" d="${totalLine}"></path>
          ${events.map(point => {
            const x = toX(point.index);
            return `<line class="account-event-line" x1="${x}" y1="${view.t}" x2="${x}" y2="${view.t + height}"></line><circle cx="${x}" cy="${toY(point.value)}" r="4.2" fill="#f2c94c" stroke="#fff" stroke-width="2"></circle>`;
          }).join("")}
          ${xLabels.map((label, index) => {
            const x = view.l + index * (width / 2);
            return `<text class="chart-label" text-anchor="middle" x="${x}" y="196">${label}</text>`;
          }).join("")}
          <circle cx="${totalPoints[totalPoints.length - 1][0].toFixed(1)}" cy="${totalPoints[totalPoints.length - 1][1].toFixed(1)}" r="4.8" fill="#00174b"></circle>
        </svg>

    }

    function accountChartSvg(range = "1D", compact = false) {
      return accountCompositionChartSvg(range, compact);

    function investmentChartSvg(range = "1D", compact = false) {

    function historySeries(assetId, range) {
      const asset = byId[assetId];
      const current = state.prices[assetId] || asset.basePrice;
      const config = {
        "1D": { count: 24, noise: .42, wave: .95 },
        "5D": { count: 32, noise: .68, wave: 1.25 },
        "1R": { count: 54, noise: 1.08, wave: 1.75 }
      }[range] || { count: 32, noise: .68, wave: 1.25 };
      const riskMultiplier = asset.risk === "vysoké" || asset.risk === "vysokÃ©" ? 1.55 : asset.risk === "vyššie" ? 1.32 : asset.risk === "stredné" || asset.risk === "strednÃ©" ? 1.08 : .72;
      const sigma = Math.min(asset.basePrice * .32, Math.max(asset.basePrice * .018, 10 * config.noise * riskMultiplier));
      const anchor = asset.basePrice + (seededUnit(`${assetId}-${range}-anchor`) - .5) * sigma;
      let value = anchor;
      const values = Array.from({ length: config.count }, (_, index) => {

        return Math.max(.05, (value * (1 - pullToCurrent)) + (current * pullToCurrent));

        button: "Resetovať",
        cancelButton: "Nechať tak",
        buttonClass: "danger",
        icon: "↺",
        onClose: resetDemo
      });
    });

    function startLiveUpdates() {
      if (window.__eduInvestPriceTimer) clearInterval(window.__eduInvestPriceTimer);
      if (window.__eduInvestNewsTimer) clearInterval(window.__eduInvestNewsTimer);
      if (window.__eduInvestFrame) cancelAnimationFrame(window.__eduInvestFrame);
      window.__eduInvestLastPriceTick = Date.now();
      window.__eduInvestLastNewsTick = Date.now();
      window.__eduInvestPriceTimer = setInterval(() => {
        try {
          tickPrices();
          window.__eduInvestLastPriceTick = Date.now();
        } catch (error) {
          console.error("price tick failed", error);
        }
      }, PRICE_TICK_MS);
      window.__eduInvestNewsTimer = setInterval(() => {
        try {
          tickNews();
          window.__eduInvestLastNewsTick = Date.now();
        } catch (error) {
          console.error("news tick failed", error);
        }
      }, NEWS_TICK_MS);
      const frameLoop = () => {
        const now = Date.now();
        if (now - window.__eduInvestLastPriceTick >= PRICE_TICK_MS) {
          try {
            tickPrices();
            window.__eduInvestLastPriceTick = now;
          } catch (error) {
            console.error("price frame tick failed", error);
          }
        }
        if (now - window.__eduInvestLastNewsTick >= NEWS_TICK_MS) {
          try {
            tickNews();
            window.__eduInvestLastNewsTick = now;
          } catch (error) {
            console.error("news frame tick failed", error);
          }
        }
        window.__eduInvestFrame = requestAnimationFrame(frameLoop);
      };
      window.__eduInvestFrame = requestAnimationFrame(frameLoop);
    }

    startLiveUpdates();
    render();
  </script>
</body>
</html>
