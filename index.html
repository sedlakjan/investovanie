<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investuj s rozumom - demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f9f9ff;
      --card: #ffffff;
      --card-soft: #f0f3ff;
      --card-mid: #e4eaff;
      --ink: #191c20;
      --muted: #585e71;
      --line: #c5c6d0;
      --blue: #4479ff;
      --blue-dark: #00174b;
      --purple: #5851d8;
      --green: #138a4d;
      --red: #c43d3d;
      --yellow: #f2c94c;
      --shadow: 0 8px 24px rgba(68, 121, 255, .065), 0 2px 8px rgba(17, 49, 86, .035);
      --shadow-strong: 0 18px 38px rgba(0, 23, 75, .16);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -10%, rgba(68,121,255,.12), transparent 34rem),
        linear-gradient(180deg, #f9f9ff 0%, #f4f7ff 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100dvh; padding-bottom: 126px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.86);
      border-bottom: 1px solid rgba(197,198,208,.72);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      min-height: 66px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 10px;
      align-items: center;
    }
    .brand {
      text-align: center;
      font-weight: 850;
      color: var(--blue);
      letter-spacing: 0;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(240,243,255,.72);
      color: var(--blue-dark);
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    .icon-btn:hover { background: #e4eaff; }
    .icon-btn:disabled { opacity: .2; cursor: default; }

    main {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 22px 18px 34px;
    }
    .screen { animation: rise .18s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(26px, 8vw, 42px); line-height: 1.08; letter-spacing: 0; margin-bottom: 10px; }
    h2 { font-size: 24px; line-height: 1.2; margin-bottom: 8px; }
    h3 { font-size: 17px; margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.55; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .amount {
      font-size: clamp(30px, 10vw, 48px);
      font-weight: 900;
      letter-spacing: 0;
      color: inherit;
    }

    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.categories { grid-template-columns: 1fr; }
    .section { margin-top: 24px; }
    .card {
      background: var(--card);
      border: 1px solid rgba(197,198,208,.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .hero {
      background:
        radial-gradient(circle at 86% 10%, rgba(255,255,255,.18), transparent 9rem),
        linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      border: 0;
      overflow: hidden;
      position: relative;
    }
    .hero p { color: rgba(255,255,255,.82); }
    .hero:after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -70px;
      top: -65px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
    }
    .dark-card {
      background:
        radial-gradient(circle at 96% 6%, rgba(68,121,255,.42), transparent 9rem),
        linear-gradient(135deg, var(--blue-dark), #113156);
      color: #fff;
      border: 0;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-strong);
    }
    .dark-card p { color: rgba(255,255,255,.74); }
    .stat-card p { margin-bottom: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card strong { display: block; font-size: 22px; }
    .page-intro {
      margin-bottom: 22px;
    }
    .page-intro h1,
    .page-intro h2 {
      margin-bottom: 4px;
      font-size: 24px;
      font-weight: 850;
    }
    .page-intro p {
      margin-bottom: 0;
      font-size: 14px;
    }
    .total-card {
      min-height: 154px;
      padding: 24px;
    }
    .total-card .amount {
      font-size: 32px;
      line-height: 1.2;
    }
    .total-watermark {
      position: absolute;
      right: -18px;
      top: -22px;
      font-size: 132px;
      opacity: .1;
      color: #fff;
      line-height: 1;
    }
    .soft-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 8px;
      padding: 4px 8px;
      background: rgba(26, 188, 110, .16);
      color: #39d987;
      font-size: 12px;
      font-weight: 900;
    }
    .action-stack {
      display: grid;
      gap: 12px;
    }
    .action-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .action-btn {
      border-radius: 16px;
      min-height: 54px;
      font-size: 15px;
    }
    .action-icon {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: 17px;
      line-height: 1;
    }
    .portfolio-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }
    .portfolio-head h2,
    .portfolio-head h3 {
      margin: 0;
      font-size: 18px;
    }
    .link-btn {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 13px;
      font-weight: 850;
      padding: 0;
    }
    .portfolio-card {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 13px;
      align-items: center;
      text-align: left;
      padding: 16px;
      border-radius: 20px;
    }
    .portfolio-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #edf1ff;
      color: var(--blue);
      font-size: 21px;
      font-weight: 900;
    }
    .portfolio-title {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 850;
    }
    .portfolio-meta {
      margin: 0;
      color: #737989;
      font-size: 12px;
      font-weight: 700;
    }
    .portfolio-value {
      color: var(--ink);
      text-align: right;
      font-weight: 900;
      white-space: nowrap;
    }
    .portfolio-gain {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .payment-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 12px;
      align-items: center;
    }
    .copy-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: var(--card-soft);
      color: var(--blue);
      font-weight: 900;
    }
    .order-card {
      border-radius: 20px;
      padding: 20px;
    }
    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .wallet-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--card-soft);
      color: var(--blue);
      font-size: 22px;
      font-weight: 900;
    }
    .mini-chart {
      width: 96px;
      height: 48px;
      opacity: .95;
    }
    .order-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .summary-box {
      border-radius: 16px;
      background: var(--card-soft);
      border: 1px solid rgba(197,198,208,.38);
      padding: 14px;
    }
    .summary-box p {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .summary-box strong {
      display: block;
      font-size: 16px;
    }
    .order-total {
      margin-top: 14px;
      border-radius: 20px;
      background: var(--blue-dark);
      color: #fff;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow-strong);
    }
    .order-total span { color: rgba(255,255,255,.78); }
    .order-total strong { font-size: 22px; text-align: right; }
    .legal {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.55;
      padding-inline: 14px;
    }

    .btn {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 850;
      text-decoration: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 10px 26px rgba(68,121,255,.24); }
    .btn.dark { background: var(--blue-dark); color: #fff; }
    .btn.ghost { background: #fff; color: var(--blue); border: 1px solid rgba(47,104,255,.24); }
    .btn.soft { background: var(--card-soft); color: var(--blue-dark); }
    .btn.danger { background: #fff2f2; color: var(--red); border: 1px solid #ffd4d4; }
    .btn.full { width: 100%; }
    .btn[disabled] { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .choice {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 60px;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(68,121,255,.035);
    }
    .choice.active { border-color: var(--blue); background: var(--card-soft); color: var(--blue-dark); }

    .input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 13px 15px;
      font-weight: 800;
      color: var(--ink);
      outline: none;
    }
  
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(68,121,255,.14); }
    .field { display: grid; gap: 8px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; }
    .input-wrap { position: relative; }
    .input-wrap .suffix {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 900;
    }
    .input-wrap .input { padding-right: 54px; }

    .rows { display: grid; gap: 10px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(197,198,208,.48);
    }
    .row:last-child { border-bottom: 0; }
    .row span:first-child { color: var(--muted); }
    .row strong, .row span:last-child { text-align: right; }

    .asset-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .asset-card h3 { margin-bottom: 3px; }
    .asset-card p { margin-bottom: 0; font-size: 13px; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 18px;
      background: #fff;
      border: 1px solid rgba(117,119,128,.36);
      border-radius: 28px;
      box-shadow: inset 0 -2px 0 rgba(0,23,75,.04), 0 4px 12px rgba(17,49,86,.08);
      color: var(--muted);
      margin-top: 18px;
    }
    .search-box span {
      font-size: 28px;
      color: #667085;
    }
    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
      font-weight: 650;
    }
    .search-box input::placeholder { color: #747b8f; }
    .category-card {
      position: relative;
      min-height: 260px;
      overflow: hidden;
      text-align: left;
      border: 1px solid rgba(228,234,255,.95);
      background: #fff;
      box-shadow: 0 9px 22px rgba(68,121,255,.075);
      padding: 24px;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(68,121,255,.13);
    }
    .category-card:after {
      content: "";
      position: absolute;
      right: -76px;
      bottom: -86px;
      width: 250px;
      height: 250px;
      border-radius: 999px;
      opacity: .28;
      pointer-events: none;
    }
    .category-card.stocks:after { background: radial-gradient(circle, rgba(33, 220, 139, .42), transparent 66%); }
    .category-card.etf:after { background: radial-gradient(circle, rgba(68, 121, 255, .24), transparent 66%); }
    .category-card.commodities:after { background: radial-gradient(circle, rgba(242, 201, 76, .42), transparent 66%); }
    .category-card.crypto:after { background: radial-gradient(circle, rgba(88, 81, 216, .28), transparent 66%); }
    .category-card .cat-watermark {
      position: absolute;
      right: -18px;
      bottom: -18px;
      z-index: 0;
      color: #2f68ff;
      opacity: .06;
      font-size: 148px;
      line-height: 1;
      font-weight: 900;
      transform: rotate(-4deg);
      pointer-events: none;
    }
    .category-card.stocks .cat-watermark { color: #15b86f; }
    .category-card.etf .cat-watermark { color: #4479ff; }
    .category-card.commodities .cat-watermark { color: #d8a313; }
    .category-card.crypto .cat-watermark { color: #5851d8; }
    .cat-art {
      position: relative;
      z-index: 1;
      display: block;
      width: min(52%, 150px);
      aspect-ratio: 1;
      object-fit: contain;
      margin: -8px 0 12px -8px;
      filter: drop-shadow(0 16px 20px rgba(17,49,86,.12));
      user-select: none;
      pointer-events: none;
    }
    .asset-icon,
    .detail-logo {
      display: grid;
      place-items: center;
      color: var(--blue-dark);
      background: #dce2ff;
      font-weight: 900;
    }
    .category-card .cat-title {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      font-size: 36px;
      line-height: 1.05;
      color: #071225;
      font-weight: 900;
    }
    .category-card .cat-sub {
      position: relative;
      z-index: 1;
      margin: 0 0 34px;
      color: #737989;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .category-card .cat-link {
      position: relative;
      z-index: 1;
      color: var(--blue);
      font-size: 20px;
      font-weight: 850;
    }
    .category-card .cat-arrow {
      position: absolute;
      right: 30px;
      bottom: 36px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 14px 28px rgba(17,49,86,.11);
      color: var(--blue);
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
    }
    .asset-list { gap: 12px; }
    .market-card {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 16px;
      border-radius: 16px;
      text-align: left;
      box-shadow: 0 7px 18px rgba(68,121,255,.075);
    }
    .asset-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      font-size: 18px;
      color: var(--blue);
      background: #edf1ff;
    }
    .market-card h3 {
      margin: 0 0 3px;
      font-size: 16px;
      color: #313848;
    }
    .market-card .ticker {
      margin: 0 0 12px;
      color: #6d7484;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .market-card .desc {
      grid-column: 2 / 4;
      margin: -4px 0 4px;
      font-size: 13px;
      color: #616978;
    }
    .market-price {
      text-align: right;
      color: #313848;
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
    }
    .price-slot {
      display: inline-flex;
      max-width: 100%;
      overflow: hidden;
      vertical-align: bottom;
      line-height: 1.08;
    }
    .price-slot span {
      display: inline-block;
      animation: slotRoll .54s cubic-bezier(.2,.75,.2,1);
      will-change: transform, opacity, filter;
    }
    @keyframes slotRoll {
      0% { transform: translateY(-1.15em); opacity: .22; filter: blur(3px); }
      48% { transform: translateY(.18em); opacity: .74; filter: blur(1px); }
      100% { transform: translateY(0); opacity: 1; filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .price-slot span { animation: none; }
    }
    .market-change {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 900;
    }
    .market-actions {
      grid-column: 1 / 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .mini-label {
      color: #596171;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .mini-detail {
      min-height: 34px;
      border-radius: 10px;
      padding: 8px 15px;
      font-size: 12px;
      box-shadow: 0 6px 14px rgba(68,121,255,.20);
    }
    .detail-hero {
      position: relative;
      min-height: 360px;
      padding: 18px 18px 0;
      background: #f8f9ff;
      border: 0;
      box-shadow: none;
      overflow: hidden;
    }
    .detail-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .detail-logo {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      color: #78d9ff;
      background: #062846;
      font-size: 17px;
    }
    .detail-head h1 {
      margin: 0 0 2px;
      font-size: 21px;
      line-height: 1.1;
    }
    .detail-head p {
      margin: 0;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .detail-price {
      position: relative;
      z-index: 2;
      font-size: 31px;
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1;
    }
    .detail-change {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 7px;
      align-items: center;
      margin-top: 7px;
      color: #10a85c;
      font-size: 12px;
      font-weight: 900;
    }
    .detail-change small {
      color: #7b8291;
      font-weight: 700;
    }
    .chart-toolbar {
      position: absolute;
      right: 18px;
      top: 88px;
      z-index: 3;
      display: inline-flex;
      gap: 4px;
      margin-top: 0;
      padding: 4px;
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(197,198,208,.54);
      box-shadow: 0 8px 18px rgba(17,49,86,.08);
    }
    .range-btn {
      min-width: 42px;
      min-height: 30px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #596171;
      font-size: 12px;
      font-weight: 900;
    }
    .range-btn.active {
      background: var(--blue);
      color: #fff;
    }
    .chart.detail-chart {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 220px;
      border: 0;
      box-shadow: none;
      background: transparent;
      border-radius: 0;
    }
    .detail-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: -6px;
      position: relative;
      z-index: 3;
    }
    .metric-card {
      background: #fff;
      border: 1px solid rgba(228,234,255,.85);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(68,121,255,.06);
      padding: 16px;
      min-height: 78px;
    }
    .risk-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
    }
    .risk-dots span {
      width: 8px;
      height: 8px;
      border-radius: 999px;

    function defaultState() {
      const prices = {};
      assets.forEach(asset => {
        prices[asset.id] = roundMoney(asset.basePrice * (0.985 + seeded(asset.id) * 0.03));
      });
      return {
        sessionStart: Date.now(),
        transferredAmount: 0,
        cash: 0,
        holdings: {},
        prices
      };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!parsed || Date.now() - parsed.sessionStart > DAY_MS) {
          localStorage.removeItem(STORAGE_KEY);
          return defaultState();
        }
        return { ...defaultState(), ...parsed, prices: { ...defaultState().prices, ...(parsed.prices || {}) } };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function seeded(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      return (hash % 1000) / 1000;
    }

    function seededUnit(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return ((hash >>> 0) % 100000) / 100000;
    }

    function formatMoney(value, currency = "EUR") {
      return new Intl.NumberFormat("sk-SK", { style: "currency", currency, maximumFractionDigits: 2 }).format(Number(value) || 0);
    }

    function formatAssetMoney(asset, value) {
      return formatMoney(value, asset.currency || "EUR");
    }

    function accountValue(asset, value) {
      const amount = Number(value) || 0;
      return asset.currency === "USD" ? roundMoney(amount * USD_EUR_RATE) : roundMoney(amount);
    }

    function conversionFee(asset, accountAmount) {
      return asset.currency === "USD" ? roundMoney(accountAmount * CONVERSION_FEE_RATE) : 0;
    }

    function buyBreakdown(asset, units) {
      const assetSubtotal = roundMoney((Number(units) || 0) * (state.prices[asset.id] || asset.basePrice));
      const accountSubtotal = accountValue(asset, assetSubtotal);
      const fee = conversionFee(asset, accountSubtotal);
      return {
        assetSubtotal,
        accountSubtotal,
        fee,
        total: roundMoney(accountSubtotal + fee)
      };
    }

    function animatedPrice(value, className = "", currency = "EUR") {
      const text = formatMoney(value, currency);
      return `<span class="price-slot ${className}" aria-label="${text}"><span>${text}</span></span>`;
    }

    function formatUnits(value) {
      const n = Number(value) || 0;
      return n.toLocaleString("sk-SK", { maximumFractionDigits: 4 });
    }

    function roundMoney(value) {
      return Math.round((Number(value) || 0) * 100) / 100;
    }

    function categoryOf(name) {
      return categories.find(cat => cat.name === name);
    }

    function movePrices() {
      assets.forEach(asset => {
        const cat = categoryOf(asset.category);
        const volatility = cat ? cat.volatility : 0.015;
        const drift = (Math.random() - 0.47) * volatility;
        const current = state.prices[asset.id] || asset.basePrice;
        const min = asset.basePrice * 0.65;
        const max = asset.basePrice * 1.45;
        state.prices[asset.id] = roundMoney(Math.min(max, Math.max(min, current * (1 + drift))));
      });
      saveState();
    }

    function canAutoRefreshPrices() {
      if (state.transferredAmount <= 0 || route.screen === "salary") return false;
      if (appModal.classList.contains("show")) return false;
      const activeTag = document.activeElement ? document.activeElement.tagName : "";
      return !["INPUT", "TEXTAREA", "SELECT"].includes(activeTag);
    }

    function tickPrices() {
      movePrices();
      if (canAutoRefreshPrices()) refreshVisiblePrices();
    }

    function priceMoveMarkup(assetId) {
      const asset = byId[assetId];
      const move = pctMove(assetId);
      return `${move >= 0 ? "↗ +" : "↘ "}${Math.abs(state.prices[assetId] - asset.basePrice).toFixed(2)} (${move >= 0 ? "+" : ""}${move.toFixed(2)} %)`;
    }

    function refreshVisiblePrices() {
      if (route.screen === "detail") {
        const asset = byId[route.assetId];
        const move = pctMove(asset.id);
        const detailPrice = root.querySelector(".detail-price");
        const detailChange = root.querySelector(".detail-change");
        const detailChart = root.querySelector(".detail-chart");
        if (detailPrice) detailPrice.innerHTML = animatedPrice(state.prices[asset.id], "", asset.currency);
        if (detailChange) {
          detailChange.classList.toggle("loss", move < 0);
          detailChange.innerHTML = `<span>${priceMoveMarkup(asset.id)}</span><small>Dnes</small>`;
        }
        if (detailChart) detailChart.innerHTML = chartSvg(asset.id);
        return;
      }
      if (route.screen === "category") {
        root.querySelectorAll("[data-asset-row]").forEach(card => {
          const asset = byId[card.dataset.assetRow];
          const move = pctMove(asset.id);
          const price = card.querySelector(".market-price");
          if (!price) return;
          price.innerHTML = `
            ${animatedPrice(state.prices[asset.id], "", asset.currency)}
            <span class="market-change ${move >= 0 ? "gain" : "loss"}">${move >= 0 ? "↗ +" : "↘ "}${move.toFixed(2)}%</span>
          `;
        });
        return;
      }
      if (route.screen === "dashboard") {
        renderPortfolioList();
      }
    }

    function navigate(nextRoute, replace = false) {
      if (!replace) historyStack.push(route);
      route = nextRoute;
      movePrices();
      render();
      scrollToTop();
    }

    function back() {
      route = historyStack.pop() || (state.transferredAmount > 0 ? { screen: "dashboard" } : { screen: "salary" });
      render();
      scrollToTop();
    }

    function scrollToTop() {
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }
      const reset = () => {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      };
      reset();
      requestAnimationFrame(reset);
      setTimeout(reset, 60);
    }

    function resetDemo() {
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      route = { screen: "salary" };
      historyStack = [];
      selectedTransfer = 100;
      render();
    }

      return Object.values(state.holdings).reduce((sum, holding) => {
        const asset = byId[holding.id];
        return sum + accountValue(asset, holding.units * (state.prices[holding.id] || asset.basePrice));
      }, 0);
    }

      return state.holdings[id] || null;
    }

    function categoryMeta(name) {
      const map = {
        "Akcie": { image: "stocks.png", sub: "Individuálne tituly", count: "2 400+", watermark: "↗" },
        "ETF": { image: "etf.png", sub: "Diverzifikované koše", count: "850+", watermark: "◫" },
        "Komodity": { image: "commodities.png", sub: "Suroviny a indexy", count: "120+", watermark: "⬡" },
        "Kryptomeny": { image: "crypto.png", sub: "Digitálne aktíva", count: "300+", watermark: "◈" }
      };
      return map[name] || { image: "stocks.png", sub: "Investičná kategória", count: "100+", watermark: "□" };
    }

    function pctMove(assetId) {
      const asset = byId[assetId];
      return ((state.prices[assetId] - asset.basePrice) / asset.basePrice) * 100;
    }

    function riskDots(risk) {
      const count = risk === "nízke" ? 2 : risk === "stredné" ? 3 : 5;
      return Array.from({ length: 5 }, (_, i) => `<span class="${i < count ? "on" : ""}"></span>`).join("");
    }

      title.textContent = text;
      backBtn.disabled = historyStack.length === 0 || route.screen === "salary";
      homeBtn.disabled = state.transferredAmount <= 0 || route.screen === "dashboard";
      navDashboard.classList.toggle("active", route.screen === "dashboard");
      navMarkets.classList.toggle("active", ["categories", "category", "detail", "buy", "sell"].includes(route.screen));
      navWallet.classList.toggle("active", route.screen === "salary");
    }

    function render() {
      if (route.screen === "salary") return renderSalary();
      if (route.screen === "dashboard") return renderDashboard();
      if (route.screen === "categories") return renderCategories();
      if (route.screen === "category") return renderCategory(route.category);
      if (route.screen === "detail") return renderDetail(route.assetId);
      if (route.screen === "buy") return renderBuy(route.assetId);
      if (route.screen === "sell") return renderSell(route.assetId);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function preloadImages(paths) {
      return Promise.allSettled(paths.map(path => new Promise(resolve => {
        const image = new Image();
        image.onload = resolve;
        image.onerror = resolve;
        image.src = path;
      })));
    }

    function preloadMarketAssets() {
      const categoryImages = categories.map(cat => {
        const meta = categoryMeta(cat.name);
        return `assets/categories/${meta.image}`;
      });
      const newsImages = [...new Set(quickNews.map(news => `assets/news/${news.image}.png`))];
      return preloadImages([...categoryImages, ...newsImages]);
    }

    function showTransferStep(step, title, text) {
      transferOverlay.className = `transfer-overlay show ${step || ""}`.trim();
      transferTitle.textContent = title;
      transferText.textContent = text;
    }

    async function runTransferFlow(amount) {
      root.querySelector("#sendMoneyBtn").disabled = true;
      showTransferStep("", "Spracovávame platbu", "Pripájame investičný účet a načítavame trhy.");
      const preload = preloadMarketAssets();
      await Promise.all([preload, sleep(1050)]);

      state.transferredAmount = roundMoney(amount);
      state.cash = roundMoney(amount);
      state.sessionStart = Date.now();
      saveState();

      showTransferStep("done", "Platba dorazila", "Peniaze sú pripravené na investičnom účte.");
      await sleep(850);
      showTransferStep("redirect", "Presmerovanie", "Otvárame investičný účet.");
      await sleep(2000);
      transferOverlay.className = "transfer-overlay";
      navigate({ screen: "dashboard" }, true);
    }

    function chartSvg(assetId) {
      const asset = byId[assetId];
      const range = selectedChartRange;
      const series = historySeries(assetId, range);
      const prices = series.map(point => point.price);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const padding = Math.max(3, (maxPrice - minPrice) * .18);
      const yMin = Math.max(.01, minPrice - padding);
      const yMax = maxPrice + padding;
      const left = 54;
      const top = 18;
      const width = 348;
      const height = 146;
      const bottom = top + height;
      const toX = index => left + (index / Math.max(1, series.length - 1)) * width;
      const toY = price => bottom - ((price - yMin) / Math.max(.01, yMax - yMin)) * height;
      const points = series.map((point, index) => [toX(index), toY(point.price)]);
      const line = points.map((point, index) => `${index ? "L" : "M"} ${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(" ");
      const area = `${line} L ${left + width} ${bottom} L ${left} ${bottom} Z`;
      const ticks = Array.from({ length: 4 }, (_, index) => yMin + ((yMax - yMin) / 3) * index).reverse();
      const xLabels = range === "1D" ? ["9:00", "13:00", "17:00"] : range === "5D" ? ["Po", "St", "Pi"] : ["Jan", "Jun", "Dec"];
      const last = series[series.length - 1].price;
      const first = series[0].price;
      const stroke = last >= first ? "#138a4d" : "#c43d3d";
      return `
        <svg viewBox="0 0 420 220" role="img" aria-label="Fiktivny historicky graf ceny aktiv ${asset.name}">
          <defs>
            <linearGradient id="g-${assetId}-${range}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${stroke}" stop-opacity=".22"/>
              <stop offset="1" stop-color="${stroke}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <text class="chart-title" x="54" y="15">Cena</text>
          <text class="chart-title" x="372" y="204">Cas</text>
          ${ticks.map((tick, index) => {
            const y = top + index * (height / 3);
            return `<line class="chart-grid" x1="${left}" y1="${y}" x2="${left + width}" y2="${y}"></line><text class="chart-label" x="6" y="${y + 4}">${formatAssetMoney(asset, tick)}</text>`;
          }).join("")}
          <line class="chart-axis" x1="${left}" y1="${top}" x2="${left}" y2="${bottom}"></line>
          <line class="chart-axis" x1="${left}" y1="${bottom}" x2="${left + width}" y2="${bottom}"></line>
          ${xLabels.map((label, index) => {
            const x = left + index * (width / 2);
            return `<text class="chart-label" text-anchor="middle" x="${x}" y="188">${label}</text>`;
          }).join("")}
          <path d="${area}" fill="url(#g-${assetId}-${range})"></path>
          <path d="${line}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="${points[points.length - 1][0].toFixed(1)}" cy="${points[points.length - 1][1].toFixed(1)}" r="4.8" fill="${stroke}"></circle>
        </svg>
      `;
    }

    function historySeries(assetId, range) {
      const asset = byId[assetId];
      const current = state.prices[assetId] || asset.basePrice;
      const config = {
        "1D": { count: 24, noise: .42, wave: .95 },
        "5D": { count: 32, noise: .68, wave: 1.25 },
        "1R": { count: 54, noise: 1.08, wave: 1.75 }
      }[range] || { count: 32, noise: .68, wave: 1.25 };
      const riskMultiplier = asset.risk === "vysoké" || asset.risk === "vysokÃ©" ? 1.55 : asset.risk === "stredné" || asset.risk === "strednÃ©" ? 1.08 : .72;
      const sigma = Math.min(asset.basePrice * .32, Math.max(asset.basePrice * .018, 10 * config.noise * riskMultiplier));
      const anchor = asset.basePrice + (seededUnit(`${assetId}-${range}-anchor`) - .5) * sigma;
      let value = anchor;
      const values = Array.from({ length: config.count }, (_, index) => {
        const phase = (index / Math.max(1, config.count - 1)) * Math.PI * config.wave;
        const noise = (seededUnit(`${assetId}-${range}-${index}`) - .5) * sigma;
        const wave = Math.sin(phase + seeded(assetId) * Math.PI) * sigma * .45;
        const pullToCurrent = index / Math.max(1, config.count - 1);
        value = (value * .72) + ((anchor + wave + noise) * .28);
        return Math.max(.05, (value * (1 - pullToCurrent)) + (current * pullToCurrent));
      });
      values[values.length - 1] = current;
      return values.map(price => ({ price: roundMoney(price) }));
    }
    function renderBuy(assetId) {
      const asset = byId[assetId];
      const move = pctMove(assetId);
      setTitle("Nákup");
      root.innerHTML = `

          <div class="field section">

              <span class="suffix">${asset.id}</span>

          </div>

          <div class="order-summary">

              <p>Odhad. cena</p>
              <strong id="buyEstimate"></strong>
            </div>
            <div class="summary-box">
              <p id="buyFeeLabel">Poplatok</p>
              <strong id="buyFee">0,00 €</strong>
            </div>
          </div>
          <div class="order-total">
            <span>Celková suma k úhrade</span>
            <strong id="buyTotal"></strong>
          </div>
          <div id="buyNotice" class="notice err"></div>
          <button id="confirmBuy" class="btn primary full section" type="button">Potvrdiť nákup <span aria-hidden="true">→</span></button>
          <p class="legal">Potvrdením odošleš demo pokyn na nákup za aktuálnu fiktívnu cenu.</p>
        </section>
      `;
      const input = root.querySelector("#buyUnits");
      const total = root.querySelector("#buyTotal");
      const estimate = root.querySelector("#buyEstimate");
      const fee = root.querySelector("#buyFee");
      const feeLabel = root.querySelector("#buyFeeLabel");
      const confirm = root.querySelector("#confirmBuy");
      const update = () => {
        const units = Number(input.value) || 0;
        const breakdown = buyBreakdown(asset, units);
        total.textContent = formatMoney(breakdown.total);
        estimate.textContent = asset.currency === "USD"
          ? `${formatAssetMoney(asset, breakdown.assetSubtotal)} ≈ ${formatMoney(breakdown.accountSubtotal)}`
          : formatMoney(breakdown.accountSubtotal);
        fee.textContent = formatMoney(breakdown.fee);
        feeLabel.textContent = asset.currency === "USD" ? "Poplatok za konverziu 1 %" : "Poplatok";
        confirm.disabled = units <= 0 || breakdown.total > state.cash;
        const notice = root.querySelector("#buyNotice");
        notice.className = breakdown.total > state.cash ? "notice err show" : "notice err";
        notice.textContent = breakdown.total > state.cash ? "Nemáš dostatok hotovosti na nákup vrátane poplatkov." : "";
      };
      input.addEventListener("input", update);
      confirm.addEventListener("click", () => {
        const units = Number(input.value) || 0;
        const price = state.prices[assetId];
        const breakdown = buyBreakdown(asset, units);
        if (units <= 0 || breakdown.total > state.cash) return update();
        const old = state.holdings[assetId];
        if (old) {
          const totalUnits = old.units + units;
          const avgPrice = ((old.units * old.avgPrice) + breakdown.total) / totalUnits;
          state.holdings[assetId] = { id: assetId, units: totalUnits, avgPrice: roundMoney(avgPrice) };
        } else {
          state.holdings[assetId] = { id: assetId, units, avgPrice: roundMoney(breakdown.total / units) };
        }
        state.cash = roundMoney(state.cash - breakdown.total);
        saveState();
        historyStack = [];
        showModal({
          title: "Nákup úspešný",
          text: "Kúpil si investíciu. Jej cena sa bude meniť. Vývoj investície v krátkom horizonte môže byť nepredvídateľný a ovplyvnený mnohými faktormi. Rast, alebo strata neznamená to, že si sa rozhodol dobre alebo zle.",
          button: "Späť na prehľad",
          onClose: () => navigate({ screen: "dashboard" }, true)
        });
      });
      update();
    }

    function renderSell(assetId) {
      const asset = byId[assetId];
      const holding = holdingFor(assetId);
      if (!holding) return navigate({ screen: "detail", assetId }, true);
      setTitle("Predaj");
      root.innerHTML = `
        <section class="screen">
          <div class="card order-card">
            <div class="row" style="border-bottom:0;align-items:end">
              <div>
                <p class="eyebrow">Aktuálna cena</p>
                <div class="amount" style="font-size:28px;color:var(--blue)">${animatedPrice(state.prices[assetId], "", asset.currency)}</div>
              </div>
              <div style="text-align:right">
                <p class="eyebrow">Vlastnené kusy</p>
                <strong style="font-size:24px">${formatUnits(holding.units)}</strong>
              </div>
            </div>
          </div>

          <div class="field section">
            <label for="sellUnits">Počet jednotiek na predaj</label>
            <div class="input-wrap">
              <input id="sellUnits" class="input" type="number" min="0" max="${holding.units}" step="0.0001" value="${Math.min(1, holding.units)}" inputmode="decimal">

            </div>
          </div>

          <div class="card section" style="background:var(--card-soft)">
            <h3 class="eyebrow">Rekapitulácia predaja</h3>
            <div class="rows">
              <div class="row"><span>Predajná hodnota</span><strong id="sellValue"></strong></div>
              <div class="row"><span>Poplatok za obchod</span><strong>0,00 €</strong></div>
              <div class="row"><span><strong>Celkový výnos</strong></span><strong id="sellTotal" style="color:var(--blue)"></strong></div>
            </div>
          </div>
          <div id="sellNotice" class="notice err"></div>
          <button id="confirmSell" class="btn primary full section" type="button">Potvrdiť predaj</button>
          <p class="legal">Kliknutím na tlačidlo potvrdzuješ predaj aktíva za aktuálnu fiktívnu cenu.</p>
        </section>
      `;
      const input = root.querySelector("#sellUnits");
      const total = root.querySelector("#sellTotal");
      const valueEl = root.querySelector("#sellValue");
      const confirm = root.querySelector("#confirmSell");
      root.querySelector("#sellMax").addEventListener("click", () => {
        input.value = holding.units;
        update();
      });
      const update = () => {
        const units = Number(input.value) || 0;
        const value = accountValue(asset, units * state.prices[assetId]);
        total.textContent = formatMoney(value);
        valueEl.textContent = formatMoney(value);
        confirm.disabled = units <= 0 || units > holding.units;
        const notice = root.querySelector("#sellNotice");
        notice.className = units > holding.units ? "notice err show" : "notice err";
        notice.textContent = units > holding.units ? "Nemôžeš predať viac jednotiek, ako vlastníš." : "";
      };
      input.addEventListener("input", update);
      confirm.addEventListener("click", () => {
        const units = Number(input.value) || 0;
        if (units <= 0 || units > holding.units) return update();
        const value = accountValue(asset, units * state.prices[assetId]);
        const remaining = holding.units - units;
        if (remaining <= 0.0000001) {
          delete state.holdings[assetId];
        } else {
          state.holdings[assetId] = { ...holding, units: remaining };
        }
        state.cash = roundMoney(state.cash + value);
        saveState();
        historyStack = [];
        showModal({
          title: "Predaj úspešný",
          text: "V reálnom živote je dobré vedieť, či predávaš podľa plánu, alebo len preto, že sa zmenila cena.",
          button: "Späť na prehľad",
          onClose: () => navigate({ screen: "dashboard" }, true)
        });
      });
      update();
    }

    function showModal({ title, text, button = "Pokračovať", icon = "✓", onClose, cancelButton = null, buttonClass = "primary" }) {
      modalIcon.textContent = icon;
      modalTitle.textContent = title;
      modalText.textContent = text;
      modalButton.textContent = button;
      modalButton.className = `btn ${buttonClass} full`;
      modalCancel.style.display = cancelButton ? "" : "none";
      modalCancel.textContent = cancelButton || "Zrušiť";
      modalActions.classList.toggle("confirm", Boolean(cancelButton));
      appModal.classList.add("show");
      const close = () => {
        appModal.classList.remove("show");
        modalActions.classList.remove("confirm");
        modalCancel.style.display = "none";
      };
      modalCancel.onclick = close;
      modalButton.focus();
      modalButton.onclick = () => {
        close();
        if (typeof onClose === "function") onClose();
      };
    }

    function closeModal() {
      appModal.classList.remove("show");
      modalActions.classList.remove("confirm");
      modalCancel.style.display = "none";
    }

    function showWithdrawModal() {
      modalIcon.textContent = "↙";
      modalTitle.textContent = "Vybrať peniaze";
      modalText.innerHTML = `
        <span>Dostupná hotovosť na investičnom účte je <strong>${formatMoney(state.cash)}</strong>.</span>
        <span class="modal-field">
          <label for="withdrawAmount">Suma na výber</label>
          <input id="withdrawAmount" type="number" min="1" max="${state.cash}" step="1" inputmode="decimal" value="${Math.floor(state.cash)}">
          <span id="withdrawError" class="modal-error"></span>
        </span>
      `;
      modalButton.textContent = "Vybrať";
      modalButton.className = "btn primary full";
      modalCancel.style.display = "";
      modalCancel.textContent = "Zrušiť";
      modalActions.classList.add("confirm");
      appModal.classList.add("show");
      const input = modalText.querySelector("#withdrawAmount");
      const error = modalText.querySelector("#withdrawError");
      const submit = () => {
        const amount = roundMoney(Number(String(input.value).replace(",", ".")));
        if (!amount || amount <= 0 || amount > state.cash) {
          error.textContent = "Zadaj platnú sumu najviac do výšky dostupnej hotovosti.";
          input.focus();
          return;
        }
        state.cash = roundMoney(state.cash - amount);
        saveState();
        closeModal();
        renderDashboard();
        showNotice("dashboardNotice", "ok", `Vybral si ${formatMoney(amount)}.`);
      };
      modalCancel.onclick = closeModal;
      modalButton.onclick = submit;
      input.addEventListener("input", () => { error.textContent = ""; });
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") submit();
      });
      input.focus();
      input.select();
    }

    function showNotice(id, type, text, html = false) {
      const notice = root.querySelector(`#${id}`);

      notice.className = `notice ${type} show`;
